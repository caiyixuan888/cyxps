<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔡宜萱 - 个人简历</title>
  <style>
    :root {
      /* 浅色模式：粉蓝渐变底色与光晕 */
      --bg-color: #f4f7fb;
      --bg-gradient: 
        radial-gradient(circle at 15% 50%, rgba(251, 207, 232, 0.45) 0%, transparent 50%), 
        radial-gradient(circle at 85% 30%, rgba(191, 219, 254, 0.45) 0%, transparent 50%);
      --text-color: #1e293b;
      --text-secondary: #64748b;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(255, 255, 255, 0.6);
      --primary: #4f46e5;
      --primary-light: #e0e7ff;
      --accent: #db2777;
      --nav-bg: rgba(255, 255, 255, 0.75);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
      --transition: 0.2s ease;
      --border-radius: 16px;
    }

    html[data-theme="dark"] {
      /* 深色模式：暗夜粉蓝渐变 */
      --bg-color: #0b1120;
      --bg-gradient: 
        radial-gradient(circle at 15% 50%, rgba(219, 39, 119, 0.15) 0%, transparent 50%), 
        radial-gradient(circle at 85% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 50%);
      --text-color: #f1f5f9;
      --text-secondary: #94a3b8;
      --card-bg: rgba(30, 41, 59, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #818cf8;
      --primary-light: rgba(129, 140, 248, 0.15);
      --accent: #f472b6;
      --nav-bg: rgba(11, 17, 32, 0.8);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      line-height: 1.6;
      transition: background-color 0.3s, color 0.3s;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 导航栏 */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background-color: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      transition: background-color 0.3s;
    }

    .nav-brand {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color var(--transition);
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-color);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
    }

    .btn-icon:hover {
      background-color: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 容器 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Hero 区域 */
    #hero {
      padding: 120px 0 60px;
      animation: fadeInUp 0.6s ease forwards;
    }

    .hero-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .hero-text {
      flex: 1;
    }

    .hero-greeting {
      font-size: 1rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    .hero-name {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-title {
      font-size: 1.2rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
      font-weight: 500;
    }

    .hero-summary {
      font-size: 1rem;
      color: var(--text-color);
      margin-bottom: 24px;
      opacity: 0.9;
      line-height: 1.7;
    }

    .hero-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px -3px rgba(219, 39, 119, 0.3);
    }

    .btn-outline {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--card-border);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    /* 头像设置 */
    .hero-avatar {
      width: 200px;
      height: 200px;
      flex-shrink: 0;
      animation: fadeIn 0.8s ease 0.2s forwards;
      opacity: 0;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--card-bg);
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3), 0 8px 10px -6px rgba(219, 39, 119, 0.2);
      background-color: var(--primary-light);
    }

    .hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 通用区域 */
    section {
      padding: 50px 0;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 30px;
      position: relative;
      display: inline-block;
      color: var(--text-color);
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 40px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      border-radius: 2px;
    }

    /* 亮点成果 */
    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .highlight-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeInUp 0.6s ease forwards;
      opacity: 0;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .highlight-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .highlight-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(219, 39, 119, 0.1), rgba(79, 70, 229, 0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1.2rem;
    }

    .highlight-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-color);
      line-height: 1.5;
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 8px 16px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: all var(--transition);
      position: relative;
    }

    .tab-btn:hover {
      color: var(--primary);
      background-color: var(--primary-light);
    }

    .tab-btn[aria-selected="true"] {
      color: var(--primary);
      background-color: var(--primary-light);
      font-weight: 600;
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .tab-panel.active {
      display: block;
    }

    /* 经历卡片 */
    .exp-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .exp-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .exp-company {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-color);
    }

    .exp-role {
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 600;
    }

    .exp-date {
      font-size: 0.85rem;
      color: var(--primary);
      white-space: nowrap;
      background-color: var(--primary-light);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
    }

    .exp-details {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .exp-details li {
      font-size: 0.95rem;
      color: var(--text-color);
      padding-left: 16px;
      position: relative;
      opacity: 0.9;
    }

    .exp-details li::before {
      content: '•';
      color: var(--accent);
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    /* 技能矩阵 */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .skill-category {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .skill-category-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .skill-item {
      margin-bottom: 14px;
    }

    .skill-item:last-child {
      margin-bottom: 0;
    }

    .skill-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .skill-bar-bg {
      height: 6px;
      background-color: var(--card-border);
      border-radius: 3px;
      overflow: hidden;
    }

    .skill-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 3px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 教育与证书 */
    .edu-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .edu-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .edu-school {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .edu-major {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .edu-date {
      font-size: 0.85rem;
      color: var(--primary);
      background-color: var(--primary-light);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
    }

    .edu-details {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .edu-details li {
      font-size: 0.95rem;
      color: var(--text-color);
      padding-left: 16px;
      position: relative;
      opacity: 0.9;
    }

    .edu-details li::before {
      content: '•';
      color: var(--accent);
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    /* 证书卡片（带图片） */
    .cert-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 24px;
      margin-top: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .cert-header-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cert-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
    }

    .cert-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .cert-image-container {
      margin-top: 8px;
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      background-color: #fff;
    }

    .cert-image-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .cert-image-container:hover img {
      transform: scale(1.02);
    }

    /* 页脚 */
    footer {
      padding: 30px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--card-border);
      margin-top: 40px;
    }

    /* 返回顶部按钮 */
    #backToTop {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: var(--shadow-hover);
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition);
      z-index: 999;
    }

    #backToTop.show {
      opacity: 1;
      visibility: visible;
    }

    #backToTop:hover {
      transform: translateY(-3px);
      filter: brightness(1.1);
    }

    /* Toast 提示 */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: var(--text-color);
      color: var(--bg-color);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 2000;
      pointer-events: none;
      box-shadow: var(--shadow-hover);
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* 动画 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .hero-content {
        flex-direction: column-reverse;
        text-align: center;
        gap: 24px;
      }
      .hero-contact {
        justify-content: center;
      }
      .hero-avatar {
        width: 150px;
        height: 150px;
      }
      .hero-name {
        font-size: 2.2rem;
      }
      .nav-links {
        display: none;
      }
      .exp-header, .edu-header {
        flex-direction: column;
      }
      .skills-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 打印样式 */
    @media print {
      nav, #backToTop, #toast, .nav-actions, .btn-icon, .btn-outline, .btn-primary {
        display: none !important;
      }
      body {
        background: #fff !important;
        color: #000 !important;
        padding-top: 0;
      }
      #hero {
        padding: 20px 0;
      }
      .hero-content {
        flex-direction: row;
        text-align: left;
      }
      .hero-avatar {
        display: block;
        width: 120px;
        height: 120px;
        border: 2px solid #ccc;
        box-shadow: none;
      }
      .hero-name {
        -webkit-text-fill-color: #000;
        background: none;
        color: #000;
      }
      .highlight-card, .exp-card, .skill-category, .edu-card, .cert-card {
        box-shadow: none !important;
        border: 1px solid #ddd;
        background: #fff !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .cert-image-container {
        max-width: 300px;
        box-shadow: none;
        border: 1px solid #ddd;
      }
      .tab-panel {
        display: block !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .tabs-nav {
        display: none;
      }
      .skills-grid, .highlights-grid {
        grid-template-columns: 1fr 1fr;
      }
      .section-title::after {
        background: #000;
      }
      .skill-bar-fill {
        background: #000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    /* 减少动画 */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#hero" class="nav-brand">蔡宜萱</a>
    <div class="nav-links">
      <a href="#highlights">亮点</a>
      <a href="#experience">经历</a>
      <a href="#projects">项目</a>
      <a href="#skills">技能</a>
      <a href="#education">教育与证书</a>
    </div>
    <div class="nav-actions">
      <button class="btn-icon" id="themeToggle" aria-label="切换深色模式">🌙</button>
      <button class="btn-icon" id="printBtn" aria-label="打印简历">🖨️</button>
    </div>
  </nav>

  <header id="hero" class="container">
    <div class="hero-content">
      <div class="hero-text">
        <p class="hero-greeting">你好，我是</p>
        <h1 class="hero-name">蔡宜萱</h1>
        <p class="hero-title">法学翻译英语 | 大一在读</p>
        <p class="hero-summary" id="heroSummary"></p>
        <div class="hero-contact" id="heroContact"></div>
      </div>
      <div class="hero-avatar">
        <img src="头像.jpg" alt="蔡宜萱个人照片" />
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 亮点成果 -->
    <section id="highlights">
      <h2 class="section-title">亮点成果</h2>
      <div class="highlights-grid" id="highlightsGrid"></div>
    </section>

    <!-- 经历与项目 Tabs -->
    <section id="experience">
      <h2 class="section-title">经历与项目</h2>
      <div class="tabs-nav" role="tablist" aria-label="经历与项目">
        <button class="tab-btn" role="tab" aria-selected="true" aria-controls="panel-exp" id="tab-exp">校园经历</button>
        <button class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-proj" id="tab-proj">项目实践</button>
      </div>
      
      <div class="tab-panel active" id="panel-exp" role="tabpanel" aria-labelledby="tab-exp">
        <div id="expList"></div>
      </div>
      
      <div class="tab-panel" id="panel-proj" role="tabpanel" aria-labelledby="tab-proj">
        <div id="projList"></div>
      </div>
    </section>

    <!-- 技能矩阵 -->
    <section id="skills">
      <h2 class="section-title">技能矩阵</h2>

    </section>

      const email = resume.email;
      if (navigator.clipboard && window.isSecureContext) {

      } else {
        const textArea = document.createElement("textarea");
        textArea.value = email;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast();
        } catch (err) {}
        document.body.removeChild(textArea);
      }
    }

    // Tabs 交互（含键盘导航）
    function initTabs() {
      const tabs = document.querySelectorAll('.tab-btn');
      const panels = document.querySelectorAll('.tab-panel');

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          activateTab(tab);
        });
        
        tab.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            e.preventDefault();
            const currentIndex = Array.from(tabs).indexOf(tab);
            let nextIndex;
            if (e.key === 'ArrowRight') {
              nextIndex = (currentIndex + 1) % tabs.length;
            } else {
              nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
            }
            const nextTab = tabs[nextIndex];
            nextTab.focus();
            activateTab(nextTab);
          }
        });
      });

      function activateTab(tab) {
        tabs.forEach(t => {
          t.setAttribute('aria-selected', 'false');
          t.classList.remove('active');
        });
        panels.forEach(p => p.classList.remove('active'));

        tab.setAttribute('aria-selected', 'true');
        tab.classList.add('active');
        const panelId = tab.getAttribute('aria-controls');
        document.getElementById(panelId).classList.add('active');
      }
    }

    // 深浅色主题
    function initTheme() {
      const toggleBtn = document.getElementById('themeToggle');
      const storedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialTheme = storedTheme || (prefersDark ? 'dark' : 'light');
      
      document.documentElement.setAttribute('data-theme', initialTheme);
      toggleBtn.textContent = initialTheme === 'dark' ? '☀️' : '🌙';

      toggleBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        toggleBtn.textContent = next === 'dark' ? '☀️' : '🌙';
      });
    }

    // 返回顶部 & 打印
    function initButtons() {
      const backToTop = document.getElementById('backToTop');

      backToTop.addEventListener('click', () => {

      });

      });
